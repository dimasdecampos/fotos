# Copia as fotos do Google Drive (e destaques/Instagram) para o site.
# Roda de hora em hora e também pelo botão "Run workflow" na aba Actions.
name: Sincronizar fotos

on:
  schedule:
    - cron: '17 * * * *'   # de hora em hora (minuto 17: fora do horário de pico do GitHub)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fotos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow
        run: pip install pillow

      - name: Baixar fotos novas ou alteradas
        run: python scripts/sync.py

      - name: Salvar no repositório (se algo mudou)
        run: |
          git add fotos insta data
          if git diff --cached --quiet; then
            echo "Nada mudou no Drive."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sincroniza fotos do Drive"
          git push
