<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0e0e0f">
  <title>Dimas de Campos — Fotografia</title>
  <meta name="description" content="Fotografia de natureza, aventura e viagens: cachoeiras, mar, paisagens e pássaros.">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/favicon.svg">
  <!-- Prévia ao compartilhar o link (WhatsApp, Instagram, Facebook...) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Dimas de Campos Fotografia">
  <meta property="og:title" content="Dimas de Campos — Fotografia">
  <meta property="og:description" content="Fotografia de natureza, aventura e viagens: cachoeiras, mar, paisagens e pássaros.">
  <meta property="og:url" content="https://dimasdecampos.github.io/fotos/">
  <meta property="og:image" content="https://dimasdecampos.github.io/fotos/img/capa.jpg">
  <meta property="og:image:width" content="1000">
  <meta property="og:image:height" content="525">
  <meta property="og:image:alt" content="Dimas de Campos sentado sob uma cachoeira iluminada por um feixe de luz">
  <meta property="og:locale" content="pt_BR">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Conexões antecipadas com os servidores das fotos, destaques e Instagram -->
  <link rel="preconnect" href="https://www.googleapis.com">
  <link rel="preconnect" href="https://drive.google.com">
  <link rel="preconnect" href="https://lh3.googleusercontent.com">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="dns-prefetch" href="https://scontent.cdninstagram.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#portfolio">Pular para as fotos</a>

  <header class="topbar">
    <a class="brand" href="#" aria-label="Início">Dimas de Campos<span>fotografia</span></a>
    <nav class="nav" aria-label="Principal">
      <a href="#portfolio">Portfólio</a>
      <a href="#instagram">Instagram</a>
    </nav>
  </header>

  <main>
    <section id="portfolio" aria-label="Portfólio">
      <div class="filters" role="group" aria-label="Filtrar por categoria"></div>
      <div class="mosaic" id="mosaic"></div>
      <p class="empty" id="empty" hidden>Nenhuma foto nesta categoria ainda.</p>
    </section>

  </main>

  <footer class="footer" id="instagram">
    <div class="insta-head">
      <h2 class="brand"><a id="insta-handle" href="#" target="_blank" rel="noopener">@dimasdecampos</a><span>no Instagram</span></h2>
      <a class="btn btn-sm" id="insta-follow" href="#" target="_blank" rel="noopener">Seguir</a>
    </div>
    <div class="insta-grid" id="insta-grid"></div>
    <div class="footer-bottom">
      <p class="about">Fotografia de natureza, aventura e viagens.</p>
      <span>© <span id="year"></span> Dimas de Campos Fotografia</span>
      <a href="#">Voltar ao topo ↑</a>
    </div>
  </footer>

  <dialog class="lightbox" id="lightbox" aria-label="Visualizador de fotos">
    <div class="lb-bg" aria-hidden="true"></div>
    <button class="lb-btn lb-close" data-lb="close" aria-label="Fechar">✕</button>
    <button class="lb-btn lb-prev" data-lb="prev" aria-label="Foto anterior">‹</button>
    <figure>
      <img id="lb-img" alt="">
      <figcaption>
        <span id="lb-title"></span>
        <a class="lb-link" id="lb-link" href="#" target="_blank" rel="noopener" hidden>Ver no Instagram ↗</a>
        <span id="lb-count"></span>
      </figcaption>
    </figure>
    <button class="lb-btn lb-next" data-lb="next" aria-label="Próxima foto">›</button>
  </dialog>

  <script src="js/main.js"></script>
</body>
</html>
